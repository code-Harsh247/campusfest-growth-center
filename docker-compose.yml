# The Growth Center and its PostgreSQL database. The app joins the shared
# external `web` network so the host's HTTPS proxy can reach it; no ports are
# published on the host. Set POSTGRES_PASSWORD in a .env file next to this one.
name: growth-center

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: growth
      POSTGRES_USER: growth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth -d growth"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://growth:${POSTGRES_PASSWORD}@db:5432/growth
      # The copilot is off (and says so) until a key is set in .env.
      # OpenRouter is used when its key is set; Claude Haiku 5.5 is the default model.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-}
      COPILOT_EFFORT: ${COPILOT_EFFORT:-medium}
      COPILOT_PER_VISITOR_HOURLY: ${COPILOT_PER_VISITOR_HOURLY:-20}
      COPILOT_HOURLY_LIMIT: ${COPILOT_HOURLY_LIMIT:-150}
    networks:
      default: {}
      web:
        aliases: [growth-center]

volumes:
  pgdata:

networks:
  web:
    external: true
